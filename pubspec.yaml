name: app_template
description: "Template base de arquitetura Flutter (Clean Architecture + GetX)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^8.1.0
  sqflite: ^2.4.2+1
  path: ^1.9.0
  dio: ^5.9.2
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1
  injectable: ^3.0.0
  get_it: ^8.0.3
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  upgrader: ^13.3.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
